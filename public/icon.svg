<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292d32" />
      <stop offset="100%" stop-color="#1b2b35" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d5a" />
      <stop offset="100%" stop-color="#e33745" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Inner circular subtle glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#e33745" stroke-opacity="0.08" stroke-width="24" />

  <!-- Package box container with shadow -->
  <g filter="url(#dropShadow)">
    <!-- Main Box shape (3D Isometric projection) -->
    <!-- Left Face -->
    <path d="M 256 160 L 140 220 L 140 330 L 256 390 Z" fill="#b91c1c" opacity="0.85" />
    <!-- Right Face -->
    <path d="M 256 160 L 372 220 L 372 330 L 256 390 Z" fill="#dc2626" />
    <!-- Top Face -->
    <path d="M 256 160 L 372 220 L 256 280 L 140 220 Z" fill="url(#boxGrad)" />

    <!-- Tape / Ribbon details -->
    <!-- Left Ribbon -->
    <path d="M 198 190 L 198 300 L 210 306 L 210 196 Z" fill="#991b1b" opacity="0.4" />
    <!-- Right Ribbon -->
    <path d="M 314 190 L 314 300 L 302 306 L 302 196 Z" fill="#1e293b" opacity="0.15" />
    <!-- Top Ribbon Cross -->
    <path d="M 256 160 L 270 167 L 212 196 L 198 190 Z" fill="#ff4d5a" opacity="0.5" />
    <path d="M 256 160 L 242 167 L 300 196 L 314 190 Z" fill="#ff4d5a" opacity="0.3" />

    <!-- Glowing Tracking Line / Pulse -->
    <path d="M 170 350 C 130 380, 230 430, 256 390 C 282 350, 390 280, 410 240" 
          fill="none" 
          stroke="#ff4d5a" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-dasharray="1 1"
          opacity="0" />
          
    <path d="M 140 240 L 256 300 L 372 240" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />
  </g>

  <!-- Clean minimalist map pin representing tracking destination -->
  <g transform="translate(256, 190) scale(1.1)">
    <path d="M 0 -24 C -10 -24, -18 -16, -18 -6 C -18 8, 0 24, 0 24 C 0 24, 18 8, 18 -6 C 18 -16, 10 -24, 0 -24 Z" fill="#f8fafc" />
    <circle cx="0" cy="-6" r="6" fill="#e33745" />
  </g>
</svg>
